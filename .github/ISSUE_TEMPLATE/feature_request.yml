name: Feature request
description: Suggest an addition or change to dbt-charts or dbt-charts-playground
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Pull requests are not accepted on this repository (see
        [CONTRIBUTING.md](https://github.com/dbt-labs/dbt-charts/blob/main/CONTRIBUTING.md)), so please include enough
        detail here for us to evaluate and implement the request without a
        follow-up round trip.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not just the desired feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed YAML syntax
      description: |
        If this involves new or changed face/chart/theme YAML, show the
        syntax you'd want to write, e.g.:

        ```yaml
        charts:
          revenue_chart:
            type: bar
            x: month
            y: revenue
            your_new_field: ...
        ```
    validations:
      required: true

  - type: textarea
    id: existing-fields
    attributes:
      label: Why can't an existing field cover this?
      description: |
        New author-surface fields are a reviewed, not free, addition —
        they're a public contract that's hard to remove later. Before
        proposing a new field, tell us which existing field(s) you tried
        reusing or reshaping (e.g. `style`, `sort`, `conditional_formatting`)
        and why they didn't fit. Raw Vega-Lite passthroughs (`spec`, `mark`,
        `encoding`, `config`, `transform`, `params`, `resolve`, `hconcat`,
        `vconcat`, `concat`, `repeat`) are a closed door, not a case-by-case
        review — a request for one of these will be declined.
    validations:
      required: true
