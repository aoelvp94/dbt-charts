name: Release to PyPI

# Tag naming: dbt-charts-vX.Y.Z. dbt-charts-playground publishes from the
# monorepo (.github/workflows/release-dbt-charts-playground.yml there) — this
# repo builds and publishes a single root-level package.
#
# Guard sequence (non-semver tag, tag not on main, frozen-schema verify)
# matches what the monorepo's own dbt-charts PyPI publish workflow checked
# before it was deleted (#7611) when dbt-charts stopped publishing from
# there — do not recreate a PyPI publish workflow for dbt-charts in the
# monorepo; this file is now the only one. One guard was NOT ported: the
# monorepo's check_published_artifact.py audit, which lives at
# .github/scripts/ and is not in origin_files. Porting it means sanitizing
# internal decision-ID references out of its own docstring first (the repo's own
# forbidden_content_regexes policy would flag them) — real work, tracked
# separately rather than rushed here. The audit still runs upstream, in the
# monorepo, on every PR that touches dbt-charts/ (test-dataface.yml ::
# smoke-install), so content reaching this export has been checked once;
# this workflow's own build+publish step is the one point that isn't
# independently re-checked.
#
# Ownership: this workflow is the sole PyPI publish trigger for dbt-charts.
# The monorepo it's exported from does not publish dbt-charts to PyPI at
# all — cutting a tag there only gets a commit exported and tagged here;
# this repo's own `release: published` event is what actually ships it.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "release-${{ github.event.release.tag_name || 'manual' }}"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'dbt-charts-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # needed for the "tag is on main" branch --contains check below

      - name: Refuse non-semver release tags
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^dbt-charts-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match dbt-charts-vX.Y.Z"
            exit 1
          fi

      - name: Refuse release tags not on main
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! git branch -r --contains "${{ github.sha }}" | grep -qE '^[[:space:]]+origin/main$'; then
            echo "::error::Tag '$TAG' (commit ${{ github.sha }}) is not on origin/main."
            exit 1
          fi

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.12.6"

      - name: Verify frozen dbt charts YAML schema
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: uv run python -m dbt_charts.schema_release "${TAG#dbt-charts-v}" --verify

      - run: uv build --wheel

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: [build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.12.6"

      - run: uv publish --trusted-publishing always dist/*
