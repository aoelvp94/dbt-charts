# Concrete board that extends the _report-base template.
#
# ./_report-base.yml is a path ref anchored to this file's directory.
# The base already extends the paper theme, so this board names only the base.
# style.frame.card_gap is inherited from _report-base; not set here.

title: Monthly Sales Report
notes: >
  Monthly revenue trend — demonstrates extending a template board
  (./_report-base.yml), which carries the theme.

source: examples_db

extends: ./_report-base.yml

queries:
  monthly_revenue:
    columns: [month, revenue]
    values:
      - ["2024-01", 42000]
      - ["2024-02", 51000]
      - ["2024-03", 47500]
      - ["2024-04", 55200]
      - ["2024-05", 49800]

charts:
  revenue_trend:
    query: monthly_revenue
    type: bar
    x: month
    y: revenue

rows:
  - cols:
      - revenue_trend
