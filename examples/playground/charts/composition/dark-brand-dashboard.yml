# Visible board that extends the _dark-brand hidden base.
#
# ./_dark-brand.yml is a path ref anchored to this file's directory.
# The base already extends the neon theme, so this board names only the base.
# style.accent is inherited from _dark-brand; not set here.

title: Product Performance (dark brand)
notes: >
  Demonstrates extending a hidden board (./_dark-brand.yml) to inherit a shared
  dark theme and brand accent colour.

source: examples_db

extends: ./_dark-brand.yml

queries:
  category_revenue:
    columns: [category, revenue]
    values:
      - ["Electronics", 151980]
      - ["Accessories", 48840]
      - ["Tools", 34900]

charts:
  by_category:
    query: category_revenue
    type: bar
    x: category
    y: revenue

rows:
  - cols:
      - by_category
