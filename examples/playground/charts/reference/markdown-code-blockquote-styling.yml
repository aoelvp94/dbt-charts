title: "Markdown code & blockquote styling"
description: >
  Reference specimen for markdown prose box tokens: inline code,
  syntax-highlighted fenced code, and blockquotes painted from the theme via
  style.text.code and style.text.blockquote.

text: |
  Markdown prose tracks the **theme** automatically — body text, headings, and
  links follow the theme font and accent.

  Inline `code` renders as a rounded background chip in mono color.
  Fenced code blocks read their surface from `style.text.code` and highlight
  known language fences:

  ```python
  def hello(name: str) -> str:
      return f"hi {name}"
  ```

  ```sql
  SELECT product, SUM(revenue) AS revenue
  FROM ecommerce_orders
  GROUP BY product
  ORDER BY revenue DESC
  ```

  > Blockquotes read from `style.text.blockquote` — a muted, italic surface with
  > a quiet left rule. Use them for quoted passages and assumptions.

rows:
  - cols:
      - title: "Theme defaults"
        text: |
          This block uses the theme's `style.text.code` and
          `style.text.blockquote` defaults.

          A line with `inline code` and a reference to `style.text`.

          ```yaml
          text:
            code:
              background: "#F7F8FA"
          ```

          > A blockquote at the theme default surface and left rule.

      - title: "Per-board override"
        style:
          text:
            code:
              background: "#fff3cd"
            blockquote:
              border:
                color: "#d97706"
                width: 4
                radius: 0
        text: |
          This block overrides the fenced-code background and the blockquote
          left rule for just this card.

          ```python
          theme = "warm"   # code block on a beige surface
          ```

          > A blockquote whose left rule is recolored per-board.
