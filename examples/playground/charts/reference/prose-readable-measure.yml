title: "Prose readable measure — line-height, block margins, column.max_chars"
description: >
  Specimen for the readable-prose model: line_height on FontStyle, the block-margin
  rhythm, and the character-based column.max_chars measure. Each block states what to
  VERIFY so the render can be judged without external notes.
source: examples_db

rows:
  - title: "1 · Line-height (FontStyle)"
    style:
      background: "#f6f8fb"
    text: |
      **VERIFY:** the lines *within* this paragraph should sit about 1.25× the font
      size — a tight report rhythm, not the old loose 1.5. This paragraph is written
      long enough that it wraps across several lines on the full board width, so the
      line-to-line leading is actually visible: look at the vertical distance between
      these wrapped lines. It should feel compact but still comfortably readable. If
      the lines look airy or double-spaced, then line_height did not take and the old
      1.5 default is still in force somewhere in the cascade.

      This second paragraph is also long enough to wrap, which lets you compare the
      leading *inside* a paragraph against the larger gap *between* paragraphs. The
      between-paragraph gap is the block margin shown in demo 2 — a different, larger
      distance — and it should be clearly bigger than the within-paragraph leading you
      are checking here, not the same.

  - title: "2 · Block margins (margin_top / margin_bottom, collapse-to-max)"
    style:
      background: "#fbfcfd"
    text: |
      Body text immediately before a heading.

      ## A prose heading

      **VERIFY:** the gap *above* the heading is the larger one (~1.5 body lines) and
      the gap *below* is smaller (~0.5 line). The space above should NOT be the
      heading's top margin stacked on the previous paragraph's bottom margin — they
      collapse to the max (one ~1.5-line gap, not ~2). Body-to-body gaps stay the
      small paragraph margin.

      Body text after the heading, sitting at the tighter after-heading margin.

  - title: "3 · column.max_chars on a WIDE slot"
    style:
      background: "#fff5ef"
      text:
        column:
          max_chars: 75
          gap: 28
    text: |
      **VERIFY:** on this full-width row the prose flows into multiple SAME-MEASURE
      columns. Every column's line length should be at or below ~75 characters — none
      should run the full board width. The slot fills completely (no broken right-gap);
      surplus width becomes another column, not whitespace.

      Each paragraph is a block; the greedy fill distributes whole paragraphs across the
      columns, so reading order runs down one column then to the top of the next.

      A third paragraph to give the layout enough text to populate more than one column
      and make the same-measure cap visible across the full width of the board.

      A fourth paragraph so the column balance is obvious and the ~75-character measure
      can be eyeballed against a ruler or by counting characters on any single line.

  - cols:
      - title: "4 · Same max_chars in a NARROW slot"
        style:
          background: "#fff5ef"
          text:
            column:
              max_chars: 75
              gap: 28
        text: |
          **VERIFY:** identical `max_chars: 75`, but this container is roughly half the
          board. It is already at or below the measure, so it stays ONE column — no
          split. Same knob, different slot: narrow → single column, wide → columns.

          A second paragraph confirming the single-column behavior in a slot narrower
          than the measure.
      - title: "5 · Serif measure check"
        style:
          background: "#f6f8fb"
        text: |
          **VERIFY (serif risk):** render this specimen on a serif theme (editorial /
          cream) and confirm the column measure still lands ~75 chars. The
          character→pixel conversion reads the font's OS/2 xAvgCharWidth; a known open
          bug under-measures Source Serif weight 500 by 5–10px/line, which would make
          serif columns slightly wider than the stated measure. Flag if columns look
          looser than demo 3.
