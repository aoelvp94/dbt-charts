theme: clarity
title: Series Label Placement
notes: |
  Series labels name each plotted series. By default, dbt charts puts those
  names in a categorical legend on the side of the chart. Set
  `style.endpoint_labels.visible: true` to move them **onto the
  chart**, anchored to where each series actually lives — no more eye-bounce
  between the legend and the data.

  Where they land depends on the chart family:

  - **Line** — at the right edge, on each line's final point
  - **Area** — at the right edge, on each band's final value
  - **Vertical stacked bar** — in a side pane, anchored to each segment's vertical midpoint in the rightmost column
  - **Horizontal stacked bar** — a single rail **above** the top row, anchored to each segment's horizontal midpoint

  Toggle a chart's `endpoint_labels.visible` to flip between legend-on-side
  and labels-on-chart and you'll see the categorical legend turn off
  automatically (the two would encode the same series→colour mapping
  twice). That is a default, not a lock: author `legend.visible: true` or
  `legend.position: bottom` on the same chart and the legend stays, because
  an explicit request outranks an automatic suppression. The y-axis also
  auto-flips to the left on line/area/vertical-bar so it doesn't collide
  with the right-edge label pane.

  This feature requires a multi-series chart (the `color` channel). It's a
  no-op on single-series charts — there's only one series to name.

charts:
  line_endpoint_labels:
    query: monthly_revenue_by_product
    type: line
    title: Line — labels at each line's right endpoint
    x: month
    y: revenue
    color: product
    style:
      endpoint_labels:
        visible: true
  area_endpoint_labels:
    query: monthly_signups_by_channel
    type: area
    title: Area — labels at each band's right endpoint
    x: month
    y: signups
    color: channel
    style:
      endpoint_labels:
        visible: true
  vertical_stacked_endpoint_labels:
    query: quarterly_tickets_by_priority
    type: bar
    title: Vertical stacked bar — labels in a side pane
    x: quarter
    y: ticket_count
    color: priority
    style:
      endpoint_labels:
        visible: true
      stack: zero
  horizontal_stacked_endpoint_labels:
    query: tickets_by_team_priority
    type: bar
    title: Horizontal stacked bar — top-row series rail
    x: team
    y: ticket_count
    color: priority
    style:
      orientation: horizontal
      endpoint_labels:
        visible: true
      stack: zero
  horizontal_stacked_no_endpoint_labels:
    query: tickets_by_team_priority
    type: bar
    title: Same chart with the feature OFF — labels in the side legend
    x: team
    y: ticket_count
    color: priority
    style:
      orientation: horizontal
      endpoint_labels:
        visible: false
      stack: zero
  line_endpoint_labels_legend_kept:
    query: monthly_revenue_by_product
    type: line
    title: Authored legend.visible — kept, not suppressed
    x: month
    y: revenue
    color: product
    style:
      endpoint_labels:
        visible: true
      legend:
        visible: true
  line_endpoint_labels_legend_bottom:
    query: monthly_revenue_by_product
    type: line
    title: Authored legend.position — moved, not hidden
    x: month
    y: revenue
    color: product
    style:
      endpoint_labels:
        visible: true
      legend:
        position: bottom
