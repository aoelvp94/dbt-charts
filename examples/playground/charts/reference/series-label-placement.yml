rows:
  - text: |
      Series labels name each plotted series. By default, the names sit in
      a categorical **legend** off to the side of the chart. Set
      `style.endpoint_labels.visible: true` to move them **onto
      the chart**, anchored to where each series actually lives — no more
      eye-bounce between the legend and the data.
  - cols: ['line_endpoint_labels', 'area_endpoint_labels']
  - text: |
      ## Stacked bars: side pane vs. top-row rail

      Vertical and horizontal stacked bars place series labels in different
      positions, driven by reading direction. Vertical stacks read
      top-to-bottom along the measure axis, so per-segment side labels feel
      natural; horizontal stacks read left-to-right inside one row, so a
      single rail above the top row reads as the direct equivalent.
  - cols: ['vertical_stacked_endpoint_labels', 'horizontal_stacked_endpoint_labels']
  - text: |
      ## Before and after

      The same horizontal stacked bar with the feature OFF (categorical
      legend on the side) and ON (top-row rail). When the rail is on, the
      legend turns off automatically: the two would encode the same
      series→colour mapping twice.

      The OFF chart writes `endpoint_labels.visible: false` explicitly,
      because this board is `theme: clarity` and clarity turns the feature on.
      Omitting the key would inherit that `true` and render the same chart
      twice.
  - cols: ['horizontal_stacked_no_endpoint_labels', 'horizontal_stacked_endpoint_labels']
  - text: |
      ## Keeping the legend anyway

      That suppression is a default, not a lock. Name a legend key on the
      same chart and it wins over the automatic behaviour: `legend.visible:
      true` keeps the side legend beside the endpoint labels, and
      `legend.position: bottom` moves it under the plot rather than hiding
      it. Both charts below are the line chart from the top of this board
      with one key added.

      Two policies still outrank an authored key, and both are physical
      rather than stylistic: a card too narrow to hold a side legend falls
      back to the top strip, and a stacked bar whose plot would collapse
      keeps its legend suppressed — it would otherwise render nothing.
  - cols: ['line_endpoint_labels_legend_kept', 'line_endpoint_labels_legend_bottom']
