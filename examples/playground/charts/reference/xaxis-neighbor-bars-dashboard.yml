theme: editorial
title: Neighbor monthly-bar dashboard — cadence ladder
description: |
  Two neighbor monthly-bar charts (Revenue per Service / Services per Customer)
  at dashboard width, demonstrating flat non-tilted axes and aligned baselines.
  Expect: BOTH axes horizontal (no tilt), same quarter/year cadence with
  month names + year-anchored, baselines aligned.

style:
  frame:
    width: 1800.0

queries:
  rev_per_service:
    type: sql
    source: examples_db
    sql: >
      SELECT (DATE '2024-07-01' + to_months(i::INT))::DATE AS month,
             (19000000 + (1500000 * sin(i / 3.0))::BIGINT + i * 120000) AS revenue
      FROM range(0, 24) AS t(i) ORDER BY 1
  svc_per_customer:
    type: sql
    source: examples_db
    sql: >
      SELECT (DATE '2024-07-01' + to_months(i::INT))::DATE AS month,
             (6.0 + i * 0.03 + 0.1 * sin(i / 4.0)) AS services
      FROM range(0, 30) AS t(i) ORDER BY 1

charts:
  revenue:
    query: rev_per_service
    type: bar
    title: Revenue per Service
    x: month
    y: revenue

  services:
    query: svc_per_customer
    type: bar
    title: Services per Customer
    x: month
    y: services

rows:
  - cols: [revenue, services]
