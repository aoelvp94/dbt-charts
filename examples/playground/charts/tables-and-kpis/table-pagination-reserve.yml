title: Table Pagination Reserve
notes: |
  Pins the height a paginated table reserves against the content its current
  page actually paints. The reserve spans every page in the dataset, so a
  single wrapping row anywhere in the data sets the card height for all of
  them -- page 1 renders short and the leftover falls below the pager.

  Row 34 (page 4 of 6) carries the long value. No other golden has this shape:
  every existing paginated table either fits one page or has uniform rows, so
  the reserve and the painted content agree and the gap is invisible.
# Inline `columns`/`values` keep this specimen runnable anywhere.
queries:
  renewals:
    notes: 60 rows, one of which wraps, paginated 10 to a page.
    columns: [account, model_arr, renewal_note]
