# Interactive Variables Demo
# Demonstrates all supported variable types for HTML rendering
#
# Filter variables default to null (no selection), meaning "show all".
# When a value is selected, the filter is applied.
#
# Instructions:
# 1. Select "HTML" format in the preview dropdown
# 2. Interact with the controls to see changes!

title: Interactive Variables Demo
source: examples_db

queries:
  revenue_by_category: |
    SELECT
      category,
      SUM(revenue) AS revenue
    FROM ecommerce_orders
    GROUP BY category
    ORDER BY revenue DESC


charts:
  revenue_by_category:
    style:
      marks:
        slice:
          labels:
            template: "{{ '{:.0%}'.format(percent) }} {{ category }}"
    title: "Revenue by Category"
    type: pie
    query: revenue_by_category
    theta: revenue
    color: category



rows:
  - cols:
      - width: "70%"
        text: |
          Switch to **HTML format** above to interact with these variable controls:

          - **Region Dropdown** — Filter by region (null = show all)
          - **Category Dropdown** — Filter by category (null = show all)
          - **Product Dropdown** — Filter by product (null = show all)
          - **Text Input** — Search products by name
          - **Number** — Set minimum revenue threshold
          - **Slider** — Adjust results limit

          Variables are defined in YAML and automatically rendered as form controls in HTML output.
          Filter variables default to null, meaning "show all" until a selection is made.
      - width: "30%"
        rows:
          - revenue_by_category
  - variables:
      # Region dropdown - options match column values, null = show all
      region:
        options:
          static: [North, South, East, West]
        # No default - starts null, shows all regions

      # Category dropdown - options match column values, null = show all
      category:
        options:
          static: [Electronics, Accessories, Tools]
        # No default - starts null, shows all categories

      # Product dropdown - options match column values, null = show all
      product:
        options:
          static: [Widget A, Widget B, Gadget X, Gadget Y, Tool Z]
        # No default - starts null, shows all products

      # Text input
      search:
        label: Search Products
        input: text
        placeholder: Enter product name...
        # No default - starts empty

      # Number input
      min_revenue:
        input: number
        min: 0
        max: 10000
        step: 100
        default: 0

      # Slider/range
      limit:
        label: Results Limit
        min: 5
        max: 50
        step: 5
        default: 15

    charts:
      sales_overview:
        title: "Sales Overview{% if region %} - {{ region }}{% endif %}{% if category %} ({{ category }}){% endif %}"
        type: bar
        query:
          sql: |
            SELECT
              product,
              SUM(revenue) AS revenue
            FROM ecommerce_orders
            WHERE ({{ region }} IS NULL OR region = {{ region }})
              AND ({{ category }} IS NULL OR category = {{ category }})
              AND ({{ product }} IS NULL OR product = {{ product }})
            GROUP BY product
            ORDER BY revenue DESC
        x: product
        y: revenue
      sales_by_region:
        title: "Revenue by Region{% if category %} - {{ category }}{% endif %}"
        type: bar
        query:
          sql: |
            SELECT
              region,
              SUM(revenue) AS revenue
            FROM ecommerce_orders
            WHERE ({{ category }} IS NULL OR category = {{ category }})
            GROUP BY region
            ORDER BY revenue DESC
        x: region
        y: revenue
    cols:
      - sales_overview
      - sales_by_region
