title: "Tic-tac-toe state machine"
description: |
  A YAML-only click-through game. The board lives in hidden URL variables,
  SQL computes legal moves and game status, and table cell links advance state.

source: examples_db

variables:
  board:
    input: text
    default: "_________"
    visible: false
  turn:
    input: text
    default: X
    visible: false
  x_score:
    input: text
    default: "0"
    visible: false
  o_score:
    input: text
    default: "0"
    visible: false
  draw_score:
    input: text
    default: "0"
    visible: false

queries:
  board_rows: |
    WITH state AS (
      SELECT
        CASE
          WHEN regexp_matches('{{ board }}', '^[XO_]{9}$') THEN '{{ board }}'
          ELSE error('board must contain exactly 9 X/O/_ cells')
        END AS board,
        CASE
          WHEN '{{ turn }}' IN ('X', 'O') THEN '{{ turn }}'
          ELSE error('turn must be X or O')
        END AS turn,
        CASE
          WHEN regexp_matches(CAST('{{ x_score }}' AS VARCHAR), '^[0-9]+(\.0)?$')
          THEN CAST(CAST('{{ x_score }}' AS DOUBLE) AS INTEGER)
          ELSE error('x_score must be a non-negative integer')
        END AS x_score,
        CASE
          WHEN regexp_matches(CAST('{{ o_score }}' AS VARCHAR), '^[0-9]+(\.0)?$')
          THEN CAST(CAST('{{ o_score }}' AS DOUBLE) AS INTEGER)
          ELSE error('o_score must be a non-negative integer')
        END AS o_score,
        CASE
          WHEN regexp_matches(CAST('{{ draw_score }}' AS VARCHAR), '^[0-9]+(\.0)?$')
          THEN CAST(CAST('{{ draw_score }}' AS DOUBLE) AS INTEGER)
          ELSE error('draw_score must be a non-negative integer')
        END AS draw_score
    ),
    cells AS (
      SELECT
        board,
        turn,
        x_score,
        o_score,
        draw_score,
        '&x_score=' || x_score
          || '&o_score=' || o_score
          || '&draw_score=' || draw_score AS score_params,
        CASE WHEN turn = 'X' THEN 'O' ELSE 'X' END AS next_turn,
        substring(board, 1, 1) AS c1,
        substring(board, 2, 1) AS c2,
        substring(board, 3, 1) AS c3,
        substring(board, 4, 1) AS c4,
        substring(board, 5, 1) AS c5,
        substring(board, 6, 1) AS c6,
        substring(board, 7, 1) AS c7,
        substring(board, 8, 1) AS c8,
        substring(board, 9, 1) AS c9
      FROM state
    ),
    winners AS (
      SELECT line_owner AS winner
      FROM cells,
      (
        VALUES
          (c1, c2, c3),
          (c4, c5, c6),
          (c7, c8, c9),
          (c1, c4, c7),
          (c2, c5, c8),
          (c3, c6, c9),
          (c1, c5, c9),
          (c3, c5, c7)
      ) AS lines(a, b, c)
      CROSS JOIN LATERAL (
        SELECT CASE WHEN a = b AND b = c AND a IN ('X', 'O') THEN a END AS line_owner
      )
      WHERE line_owner IS NOT NULL
    ),
    game AS (
      SELECT
        cells.*,
        (SELECT max(winner) FROM winners) AS winner,
        (SELECT max(winner) FROM winners) IS NOT NULL AS has_winner
      FROM cells
    ),
    moves AS (
      SELECT
        *,
        CASE WHEN NOT has_winner AND c1 = '_' THEN '?board=' || turn || substring(board, 2) || '&turn=' || next_turn || score_params END AS link_1,
        CASE WHEN NOT has_winner AND c2 = '_' THEN '?board=' || substring(board, 1, 1) || turn || substring(board, 3) || '&turn=' || next_turn || score_params END AS link_2,
        CASE WHEN NOT has_winner AND c3 = '_' THEN '?board=' || substring(board, 1, 2) || turn || substring(board, 4) || '&turn=' || next_turn || score_params END AS link_3,
        CASE WHEN NOT has_winner AND c4 = '_' THEN '?board=' || substring(board, 1, 3) || turn || substring(board, 5) || '&turn=' || next_turn || score_params END AS link_4,
        CASE WHEN NOT has_winner AND c5 = '_' THEN '?board=' || substring(board, 1, 4) || turn || substring(board, 6) || '&turn=' || next_turn || score_params END AS link_5,
        CASE WHEN NOT has_winner AND c6 = '_' THEN '?board=' || substring(board, 1, 5) || turn || substring(board, 7) || '&turn=' || next_turn || score_params END AS link_6,
        CASE WHEN NOT has_winner AND c7 = '_' THEN '?board=' || substring(board, 1, 6) || turn || substring(board, 8) || '&turn=' || next_turn || score_params END AS link_7,
        CASE WHEN NOT has_winner AND c8 = '_' THEN '?board=' || substring(board, 1, 7) || turn || substring(board, 9) || '&turn=' || next_turn || score_params END AS link_8,
        CASE WHEN NOT has_winner AND c9 = '_' THEN '?board=' || substring(board, 1, 8) || turn || '&turn=' || next_turn || score_params END AS link_9
      FROM game
    )
    SELECT
      1 AS row_sort,
      CASE WHEN c1 = '_' THEN '.' ELSE c1 END AS a,
      CASE WHEN c2 = '_' THEN '.' ELSE c2 END AS b,
      CASE WHEN c3 = '_' THEN '.' ELSE c3 END AS c,
      link_1 AS link_a,
      link_2 AS link_b,
      link_3 AS link_c
    FROM moves
    UNION ALL
    SELECT
      2 AS row_sort,
      CASE WHEN c4 = '_' THEN '.' ELSE c4 END AS a,
      CASE WHEN c5 = '_' THEN '.' ELSE c5 END AS b,
      CASE WHEN c6 = '_' THEN '.' ELSE c6 END AS c,
      link_4 AS link_a,
      link_5 AS link_b,
      link_6 AS link_c
    FROM moves
    UNION ALL
    SELECT
      3 AS row_sort,
      CASE WHEN c7 = '_' THEN '.' ELSE c7 END AS a,
      CASE WHEN c8 = '_' THEN '.' ELSE c8 END AS b,
      CASE WHEN c9 = '_' THEN '.' ELSE c9 END AS c,
      link_7 AS link_a,
      link_8 AS link_b,
      link_9 AS link_c
    FROM moves
    ORDER BY row_sort

  game_status: |
    WITH state AS (
      SELECT
        CASE
          WHEN regexp_matches('{{ board }}', '^[XO_]{9}$') THEN '{{ board }}'
          ELSE error('board must contain exactly 9 X/O/_ cells')
        END AS board,
        CASE
          WHEN '{{ turn }}' IN ('X', 'O') THEN '{{ turn }}'
          ELSE error('turn must be X or O')
        END AS turn,
        CASE
          WHEN regexp_matches(CAST('{{ x_score }}' AS VARCHAR), '^[0-9]+(\.0)?$')
          THEN CAST(CAST('{{ x_score }}' AS DOUBLE) AS INTEGER)
          ELSE error('x_score must be a non-negative integer')
        END AS x_score,
        CASE
          WHEN regexp_matches(CAST('{{ o_score }}' AS VARCHAR), '^[0-9]+(\.0)?$')
          THEN CAST(CAST('{{ o_score }}' AS DOUBLE) AS INTEGER)
          ELSE error('o_score must be a non-negative integer')
        END AS o_score,
        CASE
          WHEN regexp_matches(CAST('{{ draw_score }}' AS VARCHAR), '^[0-9]+(\.0)?$')
          THEN CAST(CAST('{{ draw_score }}' AS DOUBLE) AS INTEGER)
          ELSE error('draw_score must be a non-negative integer')
        END AS draw_score
    ),
    cells AS (
      SELECT
        board,
        turn,
        x_score,
        o_score,
        draw_score,
        substring(board, 1, 1) AS c1,
        substring(board, 2, 1) AS c2,
        substring(board, 3, 1) AS c3,
        substring(board, 4, 1) AS c4,
        substring(board, 5, 1) AS c5,
        substring(board, 6, 1) AS c6,
        substring(board, 7, 1) AS c7,
        substring(board, 8, 1) AS c8,
        substring(board, 9, 1) AS c9
      FROM state
    ),
    winners AS (
      SELECT line_owner AS winner
      FROM cells,
      (
        VALUES
          (c1, c2, c3),
          (c4, c5, c6),
          (c7, c8, c9),
          (c1, c4, c7),
          (c2, c5, c8),
          (c3, c6, c9),
          (c1, c5, c9),
          (c3, c5, c7)
      ) AS lines(a, b, c)
      CROSS JOIN LATERAL (
        SELECT CASE WHEN a = b AND b = c AND a IN ('X', 'O') THEN a END AS line_owner
      )
      WHERE line_owner IS NOT NULL
    ),
    game AS (
      SELECT
        cells.*,
        (SELECT max(winner) FROM winners) AS winner,
        length(replace(board, '_', '')) AS moves_played
      FROM cells
    )
    SELECT
      CASE
        WHEN winner IS NOT NULL THEN winner || ' wins'
        WHEN length(replace(board, '_', '')) = 9 THEN 'Draw'
        ELSE turn || ' to move'
      END AS status,
      x_score AS x_score_label,
      o_score AS o_score_label,
      draw_score AS draw_score_label,
      'Reset game' AS reset_action,
      '?board=_________&turn=X'
        || '&x_score=' || CASE WHEN winner = 'X' THEN x_score + 1 ELSE x_score END
        || '&o_score=' || CASE WHEN winner = 'O' THEN o_score + 1 ELSE o_score END
        || '&draw_score=' || CASE WHEN winner IS NULL THEN draw_score + 1 ELSE draw_score END
        AS reset_link
    FROM game

charts:
  status:
    query: game_status
    type: kpi
    value: status
    label: "Game status"

  x_score:
    query: game_status
    type: kpi
    value: x_score_label
    style:
      value:
        format: integer
    label: "X score"

  o_score:
    query: game_status
    type: kpi
    value: o_score_label
    style:
      value:
        format: integer
    label: "O score"

  draw_score:
    query: game_status
    type: kpi
    value: draw_score_label
    style:
      value:
        format: integer
    label: "Draws"

  reset:
    query: game_status
    type: table
    title: ""
    style:
      pagination:
        enabled: false
      columns:
        reset_action:
          label: " "
          link: reset_link
          width: 220
          align: center
          background: "#dbeafe"
          font:
            weight: 700

      symbol_mode: anchors
      font:
        size: 18
        weight: 700
      header:
        height: 0
        rule:
          width: 0
      row:
        height: 56
  board:
    query: board_rows
    type: table
    title: ""
    conditional_formatting:
      a:
        when:
        - eq: X
          background: "#dbeafe"
          font:
            color: "#2563eb"
            weight: 800
        - eq: O
          background: "#ffedd5"
          font:
            color: "#c2410c"
            weight: 800
        - eq: "."
          background: "#f8fafc"
          font:
            color: "#94a3b8"
      b:
        when:
        - eq: X
          background: "#dbeafe"
          font:
            color: "#2563eb"
            weight: 800
        - eq: O
          background: "#ffedd5"
          font:
            color: "#c2410c"
            weight: 800
        - eq: "."
          background: "#f8fafc"
          font:
            color: "#94a3b8"
      c:
        when:
        - eq: X
          background: "#dbeafe"
          font:
            color: "#2563eb"
            weight: 800
        - eq: O
          background: "#ffedd5"
          font:
            color: "#c2410c"
            weight: 800
        - eq: "."
          background: "#f8fafc"
          font:
            color: "#94a3b8"
    style:
      pagination:
        enabled: false
      columns:
        a:
          label: " "
          link: link_a
          width: 196
          align: center
        b:
          label: " "
          link: link_b
          width: 196
          align: center
        c:
          label: " "
          link: link_c
          width: 196
          align: center

      symbol_mode: anchors
      font:
        size: 64
        weight: 800
      header:
        height: 0
        rule:
          width: 0
      row:
        height: 196
rows:
- cols:
  - status
  - x_score
  - o_score
  - draw_score
  - reset
- height: 760
  rows:
  - board
