title: All Chart Types Gallery
notes: |
  A showcase of the supported chart types in dbt charts.

source: examples_db
text: |
  dbt charts supports the following chart families powered by [Vega-Lite](https://vega.github.io/vega-lite/).

  | Category | Chart Types |
  |----------|-------------|
  | **Cartesian** | `bar`, `line`, `area`, `scatter`, `heatmap` |
  | **Radial** | `pie` |
  | **dbt charts** | `kpi`, `table` |

  Scroll down to see each chart type in action with real data.

queries:
  sales: SELECT * FROM ecommerce_orders
  product_totals: |
    SELECT
      product,
      category,
      SUM(revenue) AS revenue
    FROM ecommerce_orders
    GROUP BY product, category
    ORDER BY revenue DESC

  revenue_by_date_product: |
    SELECT
      date,
      product,
      SUM(revenue) AS revenue
    FROM ecommerce_orders
    GROUP BY date, product
    ORDER BY date, product

  revenue_by_date_category: |
    SELECT
      date,
      category,
      SUM(revenue) AS revenue
    FROM ecommerce_orders
    GROUP BY date, category
    ORDER BY date, category

  product_category_revenue: |
    SELECT
      product,
      category,
      SUM(revenue) AS revenue
    FROM ecommerce_orders
    GROUP BY product, category
    ORDER BY product, category

  category_totals: |
    SELECT
      category,
      SUM(revenue) AS revenue,
      SUM(units_sold) AS units_sold
    FROM ecommerce_orders
    GROUP BY category
    ORDER BY revenue DESC

  kpi_totals:
    columns:
      - total_revenue
      - total_units
    values:
      - [847291.5, 12847]

charts:
  bar_chart:
    query: product_totals
    type: bar
    title: Bar Chart - Revenue by Product
    x: product
    y: revenue
    color: category
    style:
      stack: zero
  line_chart:
    query: revenue_by_date_product
    type: line
    title: Line Chart - Revenue Trend
    x: date
    y: revenue
    color: product
  area_chart:
    query: revenue_by_date_category
    type: area
    title: Area Chart - Revenue Over Time
    x: date
    y: revenue
    color: category
  scatter_chart:
    query: sales
    type: scatter
    title: Scatter Chart - Revenue vs Units
    x: units_sold
    y: revenue
    color: category
  heatmap_chart:
    query: product_category_revenue
    type: heatmap
    title: Heatmap - Product Category Revenue
    x: product
    y: category
    color: revenue
  pie_chart:
    style:
      marks:
        slice:
          labels:
            template: "{{ '{:.0%}'.format(percent) }} {{ category }}"
    query: category_totals
    type: pie
    title: Pie Chart - Revenue by Category
    theta: revenue
    color: category
  kpi_revenue:
    query: kpi_totals
    type: kpi
    label: Total Revenue
    value: total_revenue
  kpi_units:
    query: kpi_totals
    type: kpi
    label: Units Sold
    value: total_units
  table_chart:
    query: sales
    type: table
    title: Sales Data Table

rows:
  - cols:
      - bar_chart
      - line_chart
      - area_chart
  - cols:
      - scatter_chart
      - heatmap_chart
      - pie_chart
  - cols:
      - kpi_revenue
      - kpi_units
  - table_chart
