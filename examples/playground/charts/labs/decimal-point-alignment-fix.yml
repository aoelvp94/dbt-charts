title: "Decimal-point alignment: axis ticks + table column (PR #7426)"
description: >
  A ladder/column mixing whole and half-step values trims to strings of
  different length ("1", "1.5", "2", "2.5"). Under text-anchor:end this used
  to right-align on the last character, so "2"'s digit landed under the "5"
  of "2.5" instead of its own "2". decimal_pad_table (baked at resolve)
  fixes both the bar chart's y-axis ticks and the table's score column.
extends: editorial
rows:
  - cols: [mixed_ladder_bar]
  - cols: [mixed_decimal_table]
charts:
  mixed_ladder_bar:
    type: line
    title: "Axis: mixed whole/half-step ladder"
    x: item
    y: value
    query:
      sql: >
        SELECT item, value FROM (
          VALUES ('A', 1.0), ('B', 1.5), ('C', 1.8), ('D', 2.2), ('E', 2.5)
        ) AS t(item, value)
      source: duckdb_local
  mixed_decimal_table:
    type: table
    title: "Table: mixed whole/decimal column"
    query:
      sql: >
        SELECT product, score FROM (
          VALUES ('Widget A', 3.0), ('Widget B', 3.5), ('Widget C', 4.0),
                 ('Widget D', 4.2), ('Widget E', 5.0)
        ) AS t(product, score)
      source: duckdb_local
    style:
      columns:
        product:
          label: Product
        score:
          label: Score
          format: ",.1~f"
          align: right
