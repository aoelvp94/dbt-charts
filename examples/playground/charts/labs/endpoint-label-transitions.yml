title: Bar Labelling — Review Proofs
description: Each pair isolates one decision. The bold line under each heading is what to look at.

source: examples_db

queries:
  by_date: |
    SELECT CAST(date AS DATE) AS date, category AS series, SUM(revenue) AS revenue
    FROM ecommerce_orders GROUP BY 1,2 ORDER BY 1,2
  by_date_6: |
    SELECT CAST(date AS DATE) AS date,
      CASE product
        WHEN 'Widget A' THEN '0 - Qualification'
        WHEN 'Widget B' THEN '1 - Discovery'
        WHEN 'Widget C' THEN '2 - Solution Alignment'
        WHEN 'Gadget X' THEN '2- Late Stage'
        WHEN 'Gadget Y' THEN '0 - Not Qualified'
        ELSE 'Pending Manual Close'
      END AS series,
      SUM(revenue) AS revenue
    FROM ecommerce_orders GROUP BY 1,2 ORDER BY 1,2
  by_region: |
    SELECT region, category AS series, SUM(revenue) AS revenue
    FROM ecommerce_orders GROUP BY 1,2 ORDER BY 1,2

charts:
  default_bar:
    query: by_date
    type: bar
    title: "type: bar (nothing else authored)"
    x: date
    y: revenue
    color: series
  stacked_bar: &stacked
    query: by_date
    type: bar
    title: "…plus style.stack: zero"
    x: date
    y: revenue
    color: series
    style:
      stack: "zero"

  grouped6_tiny: &grouped6
    query: by_date_6
    type: bar
    title: Grouped, 6 series
    x: date
    y: revenue
    color: series
  grouped6_wide: *grouped6

  stacked_tiny:
    query: by_date
    type: bar
    title: Stacked, tiny (282px)
    x: date
    y: revenue
    color: series
    style:
      stack: "zero"
  stacked_narrow:
    query: by_date
    type: bar
    title: Stacked, narrow (423px)
    x: date
    y: revenue
    color: series
    style:
      stack: "zero"

  stacked_v:
    query: by_date
    type: bar
    title: Vertical (temporal x)
    x: date
    y: revenue
    color: series
    style:
      stack: "zero"
  stacked_h:
    query: by_region
    type: bar
    title: Horizontal (discrete x)
    x: region
    y: revenue
    color: series
    style:
      stack: "zero"

  fam_bar:
    query: by_date
    type: bar
    title: Stacked bar
    x: date
    y: revenue
    color: series
    style:
      stack: "zero"
  fam_line:
    query: by_date
    type: line
    title: Line
    x: date
    y: revenue
    color: series
  fam_area:
    query: by_date
    type: area
    title: Area
    x: date
    y: revenue
    color: series
    style:
      stack: "zero"

rows:
  - title: "1 — What one authored line changes"
    text: |
      **Look for:** left has a legend above the plot with no title; right has no
      legend at all and names its series at the right edge instead.

      Grouped is the bar default, so the left chart is what an author gets from
      `type: bar` alone — and it is the common case. Its legend used to be a
      vertical rail down the right side. Direct labelling only starts once the
      author stacks.
    cols: [default_bar, stacked_bar]

  - title: "2 — Grouped legend, narrow vs wide"
    text: |
      **Look for:** the legend wraps to two rows on the narrow card and runs as
      a single row on the wide one. Six long series names either way.

      This is the one place the entry count is still a fixed number rather than
      fitted to the card — the narrow card wraps at 2 because that is the theme
      constant, not because 2 is what fits.
    grid:
      columns: 24
      row_height: "300px"
      gap: md
      items:
        - item: grouped6_tiny
          col: 0
          row: 0
          width: 7
        - item: grouped6_wide
          col: 0
          row: 1
          width: 24

  - title: "3 — Stacked bar, tiny to narrow"
    text: |
      **Look for:** the tiny card puts a legend on top; the narrow card drops it
      and labels the segments directly.

      282px has no room for a right-hand rail, so direct labelling gives way to
      a legend. 423px does.
    grid:
      columns: 24
      row_height: "300px"
      gap: md
      items:
        - item: stacked_tiny
          col: 0
          row: 0
          width: 6
        - item: stacked_narrow
          col: 7
          row: 0
          width: 9

  - title: "4 — Stacked bar, vertical vs horizontal"
    text: |
      **Look for:** left names its series down the right edge; right names them
      in a rail above the top bar.

      Two different mechanisms, chosen by whether x is a date or a category.
      Judge whether both are good enough to ship — the rail is the one that
      degrades first as series names get longer.
    cols: [stacked_v, stacked_h]

  - title: "5 — Does it read as one system?"
    text: |
      **Look for:** the same label typography, spacing and right-edge position
      on all three. None of them should draw a legend.

      Bar is the newcomer. This is also the leading change at work — labels are
      spaced at 1.45× their type size at every width now.
    cols: [fam_bar, fam_line, fam_area]
