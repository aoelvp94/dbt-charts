title: "Text tier check — gray single-series"
notes: >
  Legibility check for the gray single-series override: numeric axis labels
  and legend labels need to stay readable alongside a neutral
  (`dbt-grays.heading`) single-series mark. Both charts below need a legible
  chart with a visible legend and prominent numbers.
theme: clarity
style:
  charts:
    color:
      categorical:
        single_series_palette: [dbt-grays.heading]
source: examples_db

queries:
  by_product: |
    SELECT product, category, SUM(revenue) AS revenue, SUM(units_sold) AS units
    FROM ecommerce_orders GROUP BY 1, 2 ORDER BY 3 DESC
  by_cat: |
    SELECT category, SUM(revenue) AS revenue FROM ecommerce_orders
    GROUP BY 1 ORDER BY 2 DESC

rows:
  - cols: [t_scatter, t_bar]

charts:
  t_scatter:
    type: scatter
    title: "Scatter — legend visible"
    subtitle: "Legend labels name the series; axis titles orient"
    query: by_product
    x: units
    y: revenue
    color: category
    style:
      axis_x:
        title:
          visible: true
      axis_y:
        title:
          visible: true

  t_bar:
    type: bar
    title: "Bar — numeric axis"
    subtitle: "How dark should the numbers be?"
    query: by_cat
    x: category
    y: revenue
    style:
      orientation: vertical
      axis_y:
        title:
          visible: true
