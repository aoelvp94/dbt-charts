title: "Theme probe — clarity"
notes: >
  Same data, same layout, one theme swapped. Compare across renders.
extends: clarity
rows:
  - text: |
      ### What to look at

      **Single-series bar (below left)** — the mark color. Clarity inks it
      from `single_series_palette` (one fixed blue, `category_dark.blue`).
      Compare against `gray-single-series.yml`, the same board pinned to a
      neutral `dbt-grays.heading` mark via a board-level override.

      **Multi-series line (below right)** — editorial-10 categorical palette, direct
      endpoint labels, no legend. Chrome should recede behind the colored lines.

      **Mixed-sign bar + scatter** — the zero rule doing structural work, and a legend
      (scatter is the one family that keeps one).

      **Table** — header / value / label tiers, and whether the row stripe is visible
      without being noisy.

      Judge: gridline paleness, category-label vs number-label contrast, axis-title
      weight, and whether the drop from text to chrome reads stepped or as a cliff.

  - cols: [single_bar, multi_line]
  - cols: [mixed_bar, scatter]
  - cols: [spark_table]
charts:
  single_bar:
    type: bar
    title: "Single series — mark color + zero rule"
    subtitle: "One color. Expect a heavy zero rule under hairline gridlines."
    sort:
      by: quarter
      order: asc
    x: quarter
    y: revenue
    style:
      orientation: vertical
      axis_y:
        title:
          visible: true
        labels:
          format: "$,.0f"
      axis_x:
        title:
          visible: true
    query:
      sql: >
        SELECT quarter, revenue FROM (
          VALUES ('2024 Q1', 41200), ('2024 Q2', 47800), ('2024 Q3', 44100),
                 ('2024 Q4', 58300), ('2025 Q1', 52600), ('2025 Q2', 61900),
                 ('2025 Q3', 59400), ('2025 Q4', 71200)
        ) AS t(quarter, revenue)
      source: duckdb_local
  multi_line:
    type: line
    title: "Multi series — vivid-10 + direct labels"
    subtitle: "Expect no legend; labels at the right endpoints."
    x: month
    y: users
    color: plan
    style:
      axis_y:
        title:
          visible: true
    query:
      sql: >
        SELECT month, plan, users FROM (
          VALUES ('Jan','Starter',1200),('Feb','Starter',1310),('Mar','Starter',1480),
                 ('Apr','Starter',1520),('May','Starter',1690),('Jun','Starter',1810),
                 ('Jan','Team',740),('Feb','Team',880),('Mar','Team',1020),
                 ('Apr','Team',1190),('May','Team',1340),('Jun','Team',1560),
                 ('Jan','Business',310),('Feb','Business',345),('Mar','Business',402),
                 ('Apr','Business',471),('May','Business',560),('Jun','Business',688)
        ) AS t(month, plan, users)
      source: duckdb_local
  mixed_bar:
    type: bar
    title: "Mixed sign — the zero rule as structure"
    subtitle: "Expect the baseline to be the darkest line on the plot."
    x: segment
    y: change
    query:
      sql: >
        SELECT segment, change FROM (
          VALUES ('Enterprise', 18.4), ('Mid-market', 9.1), ('SMB', -4.2),
                 ('Self-serve', -11.7), ('Partner', 6.3)
        ) AS t(segment, change)
      source: duckdb_local
  scatter:
    type: scatter
    title: "Scatter — the one family that keeps a legend"
    subtitle: "Expect a visible legend; chrome behind the points."
    x: spend
    y: retention
    color: region
    query:
      sql: >
        SELECT spend, retention, region FROM (
          VALUES (12,71,'North'),(19,78,'North'),(27,83,'North'),(34,88,'North'),
                 (14,64,'South'),(22,69,'South'),(31,74,'South'),(41,79,'South'),
                 (17,88,'West'),(25,91,'West'),(36,94,'West'),(44,96,'West')
        ) AS t(spend, retention, region)
      source: duckdb_local
  spark_table:
    type: table
    title: "Table — header / value / label tiers"
    subtitle: "Expect a readable stripe that does not compete with the values."
    style:
      columns:
        region:
          label: Region
        deals:
          label: Deals
        revenue:
          label: Revenue
          format: currency
        win_rate:
          label: Win rate
          format: percent
    query:
      sql: >
        SELECT region, deals, revenue, win_rate FROM (
          VALUES ('North America', 412, 2840000, 0.34),
                 ('EMEA', 318, 1975000, 0.29),
                 ('APAC', 227, 1410000, 0.31),
                 ('LATAM', 96, 512000, 0.22)
        ) AS t(region, deals, revenue, win_rate)
      source: duckdb_local
