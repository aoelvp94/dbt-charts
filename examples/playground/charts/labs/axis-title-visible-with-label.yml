title: "Axis title.visible:false honored alongside an authored label"
notes: >
  Regression proof: style.axis_y.title.visible:false (and axis_x) used to be
  silently discarded whenever the chart also authored y_label/x_label. Fixed
  by giving an explicit title.visible precedence over the label-forcing
  default at resolve time.
extends: clarity
queries:
  monthly:
    sql: >
      SELECT month, sessions FROM (
        VALUES ('Jan', 100), ('Feb', 200), ('Mar', 150)
      ) AS t(month, sessions)
    source: examples_db
rows:
  - cols: [baseline, suppressed]
  - cols: [baseline_x, suppressed_x]
  - cols: [explicit_true]
charts:
  baseline:
    type: line
    title: "Expect: rotated y-axis title"
    subtitle: "y_label alone — still forces the title on, as before"
    query: monthly
    x: month
    y: sessions
    y_label: "Weekly Sessions"
  suppressed:
    type: line
    title: "Expect: no y-axis title, plot reclaims the space"
    subtitle: "y_label + axis_y.title.visible false — the fix"
    query: monthly
    x: month
    y: sessions
    y_label: "% from Data Lakes"
    style:
      axis_y:
        title:
          visible: false
  baseline_x:
    type: line
    title: "Expect: x-axis title shown under the months"
    subtitle: "x_label alone — forces the title on, same as the baseline y case"
    query: monthly
    x: month
    y: sessions
    x_label: "Fiscal Month"
  suppressed_x:
    type: line
    title: "Expect: no x-axis title under the months"
    subtitle: "x_label + axis_x.title.visible false — compare to baseline_x above"
    query: monthly
    x: month
    y: sessions
    x_label: "Fiscal Month"
    style:
      axis_x:
        title:
          visible: false
  explicit_true:
    type: line
    title: "Expect: rotated y-axis title"
    subtitle: "y_label + axis_y.title.visible true — explicit true also wins"
    query: monthly
    x: month
    y: sessions
    y_label: "Weekly Sessions"
    style:
      axis_y:
        title:
          visible: true
