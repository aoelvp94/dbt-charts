title: "Zero rule weight"
description: >
  Three places the zero/baseline rule has to work: under a positive-only bar
  (where marks sit on it), through a mixed-sign bar (where it separates
  positive from negative), and under a single-series area (where it is the
  only structural line on the plot).
theme: solid
source: examples_db

queries:
  by_cat: |
    SELECT category, SUM(revenue) AS revenue FROM ecommerce_orders
    GROUP BY 1 ORDER BY 2 DESC
  swings:
    columns: [segment, change]
    values:
      - ["Enterprise", 18.4]
      - ["Mid-market", 9.1]
      - ["SMB", -4.2]
      - ["Self-serve", -11.7]
      - ["Partner", 6.3]
  cumulative: |
    SELECT date, SUM(SUM(revenue)) OVER (ORDER BY date) AS cumulative
    FROM ecommerce_orders GROUP BY date ORDER BY date

rows:
  - cols: [z_bar, z_mixed, z_area]

charts:
  z_bar:
    type: bar
    title: "Positive only"
    subtitle: "Marks sit on the rule"
    query: by_cat
    x: category
    y: revenue
    style:
      orientation: vertical

  z_mixed:
    type: bar
    title: "Mixed sign"
    subtitle: "Rule separates + from −"
    query: swings
    x: segment
    y: change
    style:
      orientation: vertical

  z_area:
    type: area
    title: "Single-series area"
    subtitle: "Rule is the only structure"
    query: cumulative
    x: date
    y: cumulative
