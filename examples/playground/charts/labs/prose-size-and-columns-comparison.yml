  - text: |
      ### 3 · PROPOSED — body 14, two columns

      **WHAT THIS IS:** body 14 with the measure capped so the slot splits into two columns.

      **LOOK AT:** every line sits inside the 45–75 readable band, on both the serif and the
      sans font stacks. Compare directly against row 1 — same prose, same board width.

      **THIS IS THE WORKING SETTING.** Row 4 tightens the measure further and goes too
      narrow.

      Count filled lines here if you want exact figures — this render is the artifact of
      record. Character counts are deliberately not quoted in these notes; earlier
      revisions quoted them and were wrong three times.

  - style:
      background: "#fbfbfa"
      text:
        font:
          size: 14
        column:
          max_chars: 75
          gap: 28
    text: |
