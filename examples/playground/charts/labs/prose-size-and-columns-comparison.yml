title: "Prose body size and columns — today vs proposed"
notes: >
  Four settings of the same report prose. Each specimen is preceded by a note row at
  default styling, so the note never pollutes the specimen's column fill. Every note
  states what to look at, so the render can be judged without reading chat.
source: examples_db

rows:
  - text: |
      ### 1 · TODAY (defaults) — body 11, no column cap

      **WHAT THIS IS:** exactly what a Cloud report renders today. Body prose sits at the
      shared 11-unit size and fills the full board width, because no shipped theme sets a
      column measure.

      **LOOK AT:** line length — well over twice the 45–75 readable band, with no measure
      applied at all. Notice how hard it is to find the start of the next line, and how the
      paragraph breaks barely register.

  - style:
      background: "#fbfbfa"
    text: |
      **Period compared:** June 29–July 26 versus June 1–June 28. The current partial week
      is excluded.

      North America's primary issue is **insufficient MQL supply — not a regional Stage 0
      target miss or a broad loss of selling capacity**. Event sources explain **95% of the
      MQL decline**; MQLs finished **38% below target**, while target-aligned Stage 0
      remained **67% above target**. The funnel table below is the single source for
      period-over-period MQL, Stage 0, and Stage 1 counts.

      MQL-to-Stage 0 conversion was **9.5% versus 5.4%**, based on **61 of 644** mature MQLs
      versus **144 of 2,671**. The direction is statistically distinguishable in this
      snapshot, but the recent cohort is much smaller and may differ in source mix.
      **Confirm it with the next cohort before calling it durable.**

      Capacity does not explain the Stage 0 decline. **BDR had 27.5 productive FRE in July
      versus 27.5 in June**; mapped reps moved from **30 to 29** and fully ramped reps from
      **28 to 27**. Those capacity movements are far smaller than the **19% BDR** and
      **28% AE** declines in Stage 0 creation.

      Stage 1 was flat overall, but target-aligned count finished **10% below plan**, after
      an **11% shortfall** in the prior period.

      **Leadership implication:** replace the MQL supply gap, confirm the conversion signal,
      and address the persistent Stage 1 count shortfall. Do not treat Stage 0 as a regional
      target or headcount problem.

  - text: |
      ### 2 · Body size alone — 14, still no column cap

      **WHAT THIS IS:** the size change on its own, no measure applied.

      **LOOK AT:** the type is now a reading size, but the lines are still far past the
      readable band — a bigger font on a full-width slot buys fewer characters per line,
      not few enough. This row exists to show that raising the size alone does NOT fix the
      problem.

