  - text: |
      ### 4 · Three columns at body 14 — too narrow

      **WHAT THIS IS:** the same body 14 with the measure capped tighter, so the slot splits
      into three columns instead of two.

      **LOOK AT:** the columns are now too narrow — **both** font stacks fall to or below
      the 45-character readable floor, not just the sans one. Three columns is too many at
      this size on a full-width board, which is why row 3 is the proposal.

      **ON THE AUTHORED NUMBER:** this authors `max_chars: 60` and delivers noticeably
      fewer. Two effects compound: `max_chars` overshoots the real measure by 27–37% (the
      FontMeasurer task), and the `ceil` split then divides the slot into equal columns
      always *narrower* than the target. `max_chars` is an upper bound, never an exact
      width.

      **ALSO LOOK AT the column bottoms** here and in row 3. Neither fills evenly: the
      middle column here holds one paragraph and sits half empty, and row 3's left column
      ends two paragraphs early. That is the whole-block fill, and it is why continuous
      line-level flow is a prerequisite for turning columns on rather than a later polish.

