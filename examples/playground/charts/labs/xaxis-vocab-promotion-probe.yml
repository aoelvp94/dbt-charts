title: "Cadence vs vocabulary: what happens when they disagree"
notes: >
  Why the cadence ladder promotes its label vocabulary at the top rung. Forcing
  labels.time_unit=yearquarter pins the QUARTER vocabulary while the ladder thins
  visibility to YEAR, so every surviving tick is a Q1.
  EXPECT eleven identical "Q1" labels over their year rows — an axis whose labels
  carry no information. Reaching year cadence with the month vocabulary pinned
  produces the same defect wearing a different word ("Jan" twelve times), which
  is why the terminal rung promotes to a bare year instead.
extends: clarity
rows:
  - cols: [vocab_stuck]
charts:
  vocab_stuck:
    type: line
    title: "labels.time_unit: yearquarter — expect eleven identical Q1 labels"
    x: month
    y: total
    style:
      axis_x:
        labels:
          time_unit: yearquarter
    query:
      sql: >
        SELECT month, total FROM (
          SELECT CAST(d AS DATE) AS month,
                 pow(1.032, row_number() OVER (ORDER BY d)) * 1000000 AS total
          FROM generate_series(DATE '2015-04-01', DATE '2026-08-01', INTERVAL 1 MONTH) AS t(d)
        )
      source: duckdb_local
