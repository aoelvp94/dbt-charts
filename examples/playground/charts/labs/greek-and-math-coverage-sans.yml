title: Greek and Math Coverage — Sans
description: >
  Evidence board for the widened font subset, sans half. Every glyph below must be
  painted by Inter Variable, not by a system font. Serif half:
  `greek-and-math-coverage`.

theme: stark

text: |
  ## What to check

  **EXPECTED: every line below paints in Inter Variable, upright and italic.**
  Greek is in the served subset, not only in the TTF the engine measures against:
  when those two disagree, μ, σ, α, β and Δ are measured at Inter's advance widths
  and painted by whatever the OS supplies, and the wrap points are wrong.

rows:
  - text: |
      ### Greek used as notation

      μ σ α β Δ π λ ρ θ Ω

  - text: |
      ### Operators

      ≤ ≥ ≈ ≠ ± × ÷ ∑ √ ∞ ∂ ∫ ∈ ⊂

  - text: |
      ### Positions and trend

      x² x₂ ‰ ° → ← ↑ ↓ ↔

  - text: |
      ### Italic

      **EXPECTED: this line paints from a subsetted woff2**, the same recipe as
      the upright — italic is not a narrower face here.

      *μ σ Δ ≤ ≥ ∑ √ ∞ → x²*

  - text: |
      ### Statistics, as a board would actually write them

      **EXPECTED: no glyph on these two lines is painted by a system font.**

      Revenue grew 12.4% (σ = 3.1, μ = 48.2) — every cohort ≥ 40 and ∑ = 1,204.
      Confidence interval ±2.3, α = 0.05, effect size ≈ 0.8 → significant.
