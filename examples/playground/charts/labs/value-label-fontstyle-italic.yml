title: "Value-label fontStyle — italic must actually paint"
notes: >
  EXPECTED: the value labels marked ITALIC below render in an italic font.
  Before this change `labels.font.style: italic` parsed and emitted nothing, so
  every one of these read roman. Compare each italic chart against the roman
  control directly beside it — same data, same size, only font.style differs.
  The last section (series labels) has no roman control: that style lives at
  `style.charts.series_label.font`, a board-wide setting with no per-chart
  override, so this whole board authors it italic instead.
extends: clarity
style:
  charts:
    series_label:
      font:
        style: italic

queries:
  pace:
    columns: [month, revenue]
    values:
      - ["Jan", 120]
      - ["Feb", 148]
      - ["Mar", 176]
      - ["Apr", 205]

  mix:
    columns: [month, channel, signups]
    values:
      - ["Jan", "Organic", 90]
      - ["Jan", "Paid", 40]
      - ["Feb", "Organic", 105]
      - ["Feb", "Paid", 48]
      - ["Mar", "Organic", 118]
      - ["Mar", "Paid", 52]

  shares:
    columns: [channel, signups]
    values:
      - ["Organic", 313]
      - ["Paid", 140]

charts:
  bar_roman:
    query: pace
    type: bar
    title: "BAR — control (no font.style)"
    subtitle: "EXPECTED: upright roman value labels above each bar"
    x: month
    y: revenue
    style:
      marks:
        bar:
          labels:
            visible: true

  bar_italic:
    query: pace
    type: bar
    title: "BAR — labels.font.style: italic"
    subtitle: "EXPECTED: the same value labels, slanted — an italic font, not roman"
    x: month
    y: revenue
    style:
      marks:
        bar:
          labels:
            visible: true
            font:
              style: italic

  point_roman:
    query: pace
    type: line
    title: "LINE/POINT — control (no font.style)"
    subtitle: "EXPECTED: upright roman value labels above each point"
    x: month
    y: revenue
    style:
      marks:
        point:
          labels:
            visible: true

  point_italic:
    query: pace
    type: line
    title: "LINE/POINT — labels.font.style: italic"
    subtitle: "EXPECTED: the same point labels, slanted"
    x: month
    y: revenue
    style:
      marks:
        point:
          labels:
            visible: true
            font:
              style: italic

  total_roman:
    query: mix
    type: bar
    title: "STACK TOTAL — control (no font.style)"
    subtitle: "EXPECTED: upright roman total above each stack"
    x: month
    y: signups
    color: channel
    style:
      stack: zero
      marks:
        bar:
          total_label:
            visible: true

  total_italic:
    query: mix
    type: bar
    title: "STACK TOTAL — total_label.font.style: italic"
    subtitle: "EXPECTED: the same stack totals, slanted"
    x: month
    y: signups
    color: channel
    style:
      stack: zero
      marks:
        bar:
          total_label:
            visible: true
            font:
              style: italic

  pie_total_roman:
    query: shares
    type: donut
    title: "PIE TOTAL — control (no font.style)"
    subtitle: "EXPECTED: upright roman total number at donut center"
    theta: signups
    color: channel
    total:
      label: "Total Signups"

  pie_total_italic:
    query: shares
    type: donut
    title: "PIE TOTAL — style.total.value.font.style: italic"
    subtitle: "EXPECTED: the same total number, slanted"
    theta: signups
    color: channel
    total:
      label: "Total Signups"
    style:
      total:
        value:
          font:
            style: italic

  pie_slice_roman:
    query: shares
    type: donut
    title: "PIE SLICE LABEL — control (no font.style)"
    subtitle: "EXPECTED: upright roman leader-line labels beside each slice"
    theta: signups
    color: channel
    total:
      visible: false

  pie_slice_italic:
    query: shares
    type: donut
    title: "PIE SLICE LABEL — style.marks.slice.labels.font.style: italic"
    subtitle: "EXPECTED: the same slice labels, slanted"
    theta: signups
    color: channel
    total:
      visible: false
    style:
      marks:
        slice:
          labels:
            font:
              style: italic

  support_table_roman:
    query: pace
    type: bar
    title: "SUPPORT TABLE — control (no font.style)"
    subtitle: "EXPECTED: upright roman row values and row label"
    x: month
    y: revenue
    style:
      orientation: vertical
    support_table:
      - source: revenue
        label: Revenue

  support_table_italic:
    query: pace
    type: bar
    title: "SUPPORT TABLE — support_table.font.style: italic"
    subtitle: "EXPECTED: the same row values and row label, slanted"
    x: month
    y: revenue
    support_table:
      - source: revenue
        label: Revenue
    style:
      orientation: vertical
      support_table:
        font:
          style: italic
        label:
          font:
            style: italic

  endpoint_label_italic:
    query: mix
    type: line
    title: "ENDPOINT LABEL — style.charts.series_label.font.style: italic (board-wide)"
    subtitle: "EXPECTED: the right-pane series labels ('Organic'/'Paid'), slanted — no roman control possible, see description"
    x: month
    y: signups
    color: channel
    style:
      endpoint_labels:
        visible: true

rows:
  - cols: [bar_roman, bar_italic]
  - cols: [point_roman, point_italic]
  - cols: [total_roman, total_italic]
  - cols: [pie_total_roman, pie_total_italic]
  - cols: [pie_slice_roman, pie_slice_italic]
  - cols: [support_table_roman, support_table_italic]
  - cols: [endpoint_label_italic]
