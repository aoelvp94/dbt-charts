title: "Lab — pinning a category to a palette slot"
notes: |
  The companion to `lab-category-color-drift`. That board checks that a value
  keeps ONE color across charts; this one checks that an author can choose
  WHICH color, by pinning it under `style.charts.category_colors`.

  A pin names a data value exactly, including case, and gives it a palette
  slot. Pinning a slot rather than a hex is what lets the pin re-skin when
  the theme changes.

source: examples_db

style:
  charts:
    category_colors:
      category:
        values:
          Tools: category[1]
          Electronics: category[4]

queries:
  by_region_category:
    sql: |
      SELECT region, category, SUM(revenue) AS revenue
      FROM ecommerce_orders
      GROUP BY 1, 2
      ORDER BY 1, 2

  by_week_category:
    sql: |
      SELECT date_trunc('week', date) AS week, category, SUM(revenue) AS revenue
      FROM ecommerce_orders
      GROUP BY 1, 2
      ORDER BY 1, 2

  totals_by_category:
    sql: |
      SELECT category, SUM(revenue) AS revenue
      FROM ecommerce_orders
      GROUP BY 1
      ORDER BY 1

rows:
  - text: |
      ### What to check

      Two of the three categories are pinned above: `Tools` to the FIRST
      category swatch, `Electronics` to the FOURTH. `Accessories` is not
      pinned, so it takes the first slot no pin has claimed — the second.

      EXPECT, in all three charts below: Tools is the first category color,
      Electronics is the fourth, and Accessories is the second. Every chart
      agrees, including the donut, whose direct labels stay dark for contrast
      rather than taking their own wedge's ink.

  - cols:
      - chart:
          query: by_region_category
          type: bar
          x: region
          y: revenue
          color: category
          title: Revenue by region
          style:
            axis_y:
              labels:
                format: currency
      - chart:
          query: by_week_category
          type: line
          x: week
          y: revenue
          color: category
          title: Revenue by week
          style:
            axis_y:
              labels:
                format: currency

  - cols:
      - chart:
          query: totals_by_category
          type: donut
          theta: revenue
          color: category
          title: Share of revenue
      - text: |
          ### Things worth trying

          **Move a pin.** Change `Electronics` to `category[7]` and reload —
          only Electronics moves. `Tools` keeps the slot it was pinned to,
          and `Accessories` keeps the first unclaimed one.

          **Drop a pin.** Delete the `Electronics:` line. It falls back to
          the next free slot; `Tools` does not move.

          **Misspell one.** Write `electronics:` instead of `Electronics:`.
          Nothing moves: the pin matches no value the board draws, so it is
          skipped and every other category keeps the slot it already had.
          The render warns and names the value it could not place.

          **Pin a literal.** `Tools: "#7a3b2e"` paints Tools that exact hex.
          It still owns its slot, so nothing else claims the companion ink
          beside it — but unlike a slot pin, it will not follow the theme.

  - text: |
      ### What a pin's value can be

      Four forms resolve, and what separates them is whether the color
      follows the theme:

      - `category[4]` — a slot in whatever palette the theme binds to the
        `category` role. Follows the theme. This is the form to reach for.
      - `editorial-10.5`, `dbt-grays.muted` — a named stop in one specific
        palette. Fixed to that palette, so a theme swap leaves it alone.
      - `negative.solid` — a semantic tone. Worth it when a category *means*
        something, like a churned segment in the negative tone.
      - `"#7a3b2e"` — a literal hex. Exactly what you wrote, forever.

      Anything else is rejected at compile time: a CSS keyword like `red`, a
      bare role name, or a slot past the end of the palette (`category[11]`
      against a ten-stop palette).

      To recolor everything at once rather than value by value, point the
      board at a different categorical palette — `style.charts.color.categorical.palette: vivid-10`,
      or the same block on a single chart. Pins are slots, so they follow it.
