title: Digit Alignment Matrix
notes: Left/right edge x currency/plain format x four value ranges, one line chart per cell.

source: examples_db

queries:
  range_10k: |
    SELECT * FROM (VALUES
      ('Jan', 0), ('Feb', 2500), ('Mar', 5000), ('Apr', 7500), ('May', 10000)
    ) AS t(m, v)
  range_2m: |
    SELECT * FROM (VALUES
      ('Jan', 500000), ('Feb', 875000), ('Mar', 1250000), ('Apr', 1625000), ('May', 2000000)
    ) AS t(m, v)
  range_1m_1m: |
    SELECT * FROM (VALUES
      ('Jan', 100000), ('Feb', 325000), ('Mar', 550000), ('Apr', 775000), ('May', 1000000)
    ) AS t(m, v)
  range_10b: |
    SELECT * FROM (VALUES
      ('Jan', 1000000), ('Feb', 2500000000), ('Mar', 5000000000),
      ('Apr', 7500000000), ('May', 10000000000)
    ) AS t(m, v)

charts:
  currency_left_10k: &chart
    query: range_10k
    type: line
    title: "$0 - $10,000 (left)"
    x: m
    y: v
    style:
      axis_y:
        position: left
        labels:
          format: currency
  currency_right_10k:
    <<: *chart
    title: "$0 - $10,000 (right)"
    style:
      axis_y:
        position: right
        labels:
          format: currency
  plain_left_10k:
    <<: *chart
    title: "0 - 10,000 (left)"
    style:
      axis_y:
        position: left
        labels:
          format: number
  plain_right_10k:
    <<: *chart
    title: "0 - 10,000 (right)"
    style:
      axis_y:
        position: right
        labels:
          format: number

  currency_left_2m:
    <<: *chart
    query: range_2m
    title: "$500k - $2M (left)"
    style:
      axis_y:
        position: left
        labels:
          format: currency
  currency_right_2m:
    <<: *chart
    query: range_2m
    title: "$500k - $2M (right)"
    style:
      axis_y:
        position: right
        labels:
          format: currency
  plain_left_2m:
    <<: *chart
    query: range_2m
    title: "500,000 - 2,000,000 (left)"
    style:
      axis_y:
        position: left
        labels:
          format: number
  plain_right_2m:
    <<: *chart
    query: range_2m
    title: "500,000 - 2,000,000 (right)"
    style:
      axis_y:
        position: right
        labels:
          format: number

  currency_left_1m1m:
    <<: *chart
    query: range_1m_1m
    title: "$100k - $1M (left)"
    style:
      axis_y:
        position: left
        labels:
          format: currency
  currency_right_1m1m:
    <<: *chart
    query: range_1m_1m
    title: "$100k - $1M (right)"
    style:
      axis_y:
        position: right
        labels:
          format: currency
  plain_left_1m1m:
    <<: *chart
    query: range_1m_1m
    title: "100,000 - 1,000,000 (left)"
    style:
      axis_y:
        position: left
        labels:
          format: number
  plain_right_1m1m:
    <<: *chart
    query: range_1m_1m
    title: "100,000 - 1,000,000 (right)"
    style:
      axis_y:
        position: right
        labels:
          format: number

  currency_left_10b:
    <<: *chart
    query: range_10b
    title: "$1M - $10B (left)"
    style:
      axis_y:
        position: left
        labels:
          format: currency
  currency_right_10b:
    <<: *chart
    query: range_10b
    title: "$1M - $10B (right)"
    style:
      axis_y:
        position: right
        labels:
          format: currency
  plain_left_10b:
    <<: *chart
    query: range_10b
    title: "1,000,000 - 10,000,000,000 (left)"
    style:
      axis_y:
        position: left
        labels:
          format: number
  plain_right_10b:
    <<: *chart
    query: range_10b
    title: "1,000,000 - 10,000,000,000 (right)"
    style:
      axis_y:
        position: right
        labels:
          format: number

rows:
  - currency_left_10k
  - currency_right_10k
  - plain_left_10k
  - plain_right_10k
  - currency_left_2m
  - currency_right_2m
  - plain_left_2m
  - plain_right_2m
  - currency_left_1m1m
  - currency_right_1m1m
  - plain_left_1m1m
  - plain_right_1m1m
  - currency_left_10b
  - currency_right_10b
  - plain_left_10b
  - plain_right_10b
