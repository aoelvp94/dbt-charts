      - ["2026-06-01", "Ambient", 50]
      - ["2026-06-01", "Indie", 46]
      - ["2026-06-01", "Jazz", 53]

charts:
  overlap_default:
    query: channel_mix
    type: area
    title: "OVERLAP DEFAULT — no style.stack"
    subtitle: "EXPECTED: semi-transparent overlapping fills (opacity 0.16), top-edge colored strokes, halo undercoat"
    x: month
    y: signups
    color: channel

  stacked_zero:
    query: channel_mix
    type: area
    title: "STACKED (style.stack: zero)"
    subtitle: "EXPECTED: solid bands (opacity 1.0), 1px background-color separator strokes between bands, NO halo"
    x: month
    y: signups
    color: channel
    style:
      stack: "zero"

  stacked_normalize:
    query: channel_mix
    type: area
    title: "NORMALIZED STACK (style.stack: normalize)"
    subtitle: "EXPECTED: solid bands as % of total (0–100%), 1px background-color separators, NO halo"
    x: month
    y: signups
    color: channel
    style:
      stack: normalize

  streamgraph:
    query: listening_mix
    type: area
    title: "STREAMGRAPH (style.stack: center)"
    subtitle: "EXPECTED: solid bands on centered baseline (wiggle-ish), 1px background-color separators, NO zero rule, NO halo, direct end labels (no legend)"
    x: month
    y: listeners
    color: genre
    style:
      stack: center

rows:
  - overlap_default
  - stacked_zero
  - stacked_normalize
  - streamgraph
