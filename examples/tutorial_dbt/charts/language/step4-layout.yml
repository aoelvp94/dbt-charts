title: Revenue by month
source: dbt_charts_examples

style:
  background: '#FFFFFF'

variables:
  region:
    options:
      static: ["North", "South", "East", "West"]
    default: "North"

queries:
  revenue: |
    SELECT DATE_TRUNC('month', order_date) AS month,
           SUM(revenue) AS revenue
    FROM fct_orders
    WHERE {{ filter('region', region) }}
    GROUP BY 1 ORDER BY 1 LIMIT 6
  total: |
    SELECT SUM(revenue) AS revenue
    FROM fct_orders
    WHERE {{ filter('region', region) }}
  by_product: |
    SELECT product_category, SUM(revenue) AS revenue
    FROM fct_orders
    WHERE {{ filter('region', region) }}
    GROUP BY 1 ORDER BY 2 DESC LIMIT 4

charts:
  total:
    label: Revenue
    query: queries.total
    type: kpi
    value: revenue
  revenue:
    title: By month
    query: queries.revenue
    type: bar
    x: month
    y: revenue
  by_product:
    title: By category
    query: queries.by_product
    type: bar
    x: product_category
    y: revenue

rows:
  - cols: [total]
  - cols: [revenue, by_product]
