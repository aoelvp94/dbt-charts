server:
  port: 19417

# `analytics` is an ordinary `type: dbt_profile` source — the same source type
# used for plain dbt-model queries. `queries/revenue`'s `metrics:`/`dimensions:`
# keys make it a metricflow query; it lowers to SQL at compile time by calling
# MetricFlow's own compiler against this dbt project's semantic manifest
# (target/semantic_manifest.json, committed here in place of a real `dbt parse`
# run so the example works without a dbt-metricflow toolchain installed).
# The lowered SQL then executes against this same dbt_profile source, exactly
# like a hand-written SQL query would.
sources:
  analytics:
    type: dbt_profile
    profile: metricflow_example
    target: dev
