title: "Revenue (MetricFlow model: sugar)"

text: |
  This is `revenue.yml` re-authored with `model:` chart sugar. Instead of an
  explicit `queries:` block that restates the metric-vs-dimension split, the
  chart names its data model once with `model: analytics.orders` (the
  `analytics` dbt_profile source and the `orders` semantic model) and references
  fields by their bare manifest names.

  dbt charts reads the semantic manifest and infers each channel's role: `total_revenue`
  is a metric, `region` is a categorical dimension (entity-qualified to
  `order_id__region` automatically), and `metric_time__month` sets the time
  grain. The lowered SQL is identical to `revenue.yml`'s.

charts:
  revenue_by_region:
    type: bar
    model: analytics.orders
    x: metric_time__month
    y: total_revenue
    color: region

rows:
  - revenue_by_region
