# Categorical palette: editorial-10-dark
#
# Direct-label companion. Every stop keeps its base hue identity, sits clearly
# below the base in OKLCH lightness, and clears 4.5:1 on #fff, #fafafa, and
# cream #faf7f0. Aliases inherit from editorial-10 and resolve by position.

name: editorial-10-dark
extends: editorial-10
description: |
  Dark companion to editorial-10 for small direct labels on light canvases.
  Each stop is positionally paired with the same base hue.

colors:
  - "#23467f"    # 1  blue
  - "#476b98"    # 2  sky
  - "#3d614e"    # 3  green
  - "#5b3b55"    # 4  purple
  - "#955902"    # 5  gold
  - "#8a3f24"    # 6  rust
  - "#586e6f"    # 7  teal
  - "#77664a"    # 8  brown
  - "#54626f"    # 9  gray
  - "#424c4e"    # 10 graphite
