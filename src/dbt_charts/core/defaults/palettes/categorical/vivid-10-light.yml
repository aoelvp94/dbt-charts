# Categorical palette — vivid-10-light
#
# Moderate light companion to vivid-10. Each stop is the lighter, desaturated
# counterpart of the same slot in `vivid-10.yml`: lighter than base, lighter
# than dark, no louder, same hue — and strictly under the ghost tier.
#
# Pairing is positional: stop N here is the light companion of stop N in
# vivid-10. Reviewers edit the variant set (`vivid-10`, `vivid-10-dark`,
# `vivid-10-light`, `vivid-10-ghost`) together when the categorical palette
# changes.
#
# Derivation: each slot is lifted in OKLCH L above its base stop with chroma
# ~0.55x base, preserving hue while lowering visual weight. The lift is
# directional, not a mirror of the dark drop — bright slots are capped so
# every light stop sits a clear notch under its ghost twin: cyan L=0.83,
# gold L=0.82. Brown uses chroma ~0.75x (not 0.55x) so at its lifted L it
# still reads unambiguously brown rather than taupe. The five pushed slots
# (blue/cyan/green/gold/moss) are re-derived from the vivid base; the rest
# carry over from category-10-light.

name: vivid-10-light
extends: vivid-10
description: |
  Moderate light companion to vivid-10. Ten slots, each lighter and more
  desaturated than the matching vivid-10 stop, sitting strictly under the
  vivid-10-ghost tier. Pairing is positional: slot N here pairs with slot N
  in vivid-10.

colors:
  - "#628eba"    # 1 — blue       (companion to #0073c2)
  - "#8cd2e7"    # 2 — cyan       (companion to #00c8ee)
  - "#8cccab"    # 3 — green      (companion to #00ad75)
  - "#e0bf83"    # 4 — gold       (companion to #e1a500)
  - "#d0896f"    # 5 — orange     (companion to #da5a23)
  - "#b698be"    # 6 — purple     (companion to #a46fb2)
  - "#9ab27e"    # 7 — moss       (companion to #6a9228)
  - "#917459"    # 8 — brown      (companion to #7a5531)
  - "#b3b8bf"    # 9 — gray       (companion to #949daa)
  - "#686e78"    # 10 — charcoal  (companion to #505b6b)
