# Categorical palette: editorial-10-ink
#
# Darkest compact-lightness companion. It stays distinct from the direct-label
# dark tier at every slot and carries identity through hue rather than large
# lightness differences. Aliases inherit from editorial-10 by position.

name: editorial-10-ink
extends: editorial-10
description: |
  Ink-grade companion to editorial-10. Ten hue-preserving stops in a compact
  OKLCH lightness band, all distinct from the direct-label dark tier.

colors:
  - "#0f2c5a"    # 1  blue
  - "#1c395c"    # 2  sky
  - "#1f3d2d"    # 3  green
  - "#3d2438"    # 4  purple
  - "#563000"    # 5  gold
  - "#591d05"    # 6  rust
  - "#2b3c3c"    # 7  teal
  - "#43361f"    # 8  brown
  - "#29343e"    # 9  gray
  - "#252d2f"    # 10 graphite
