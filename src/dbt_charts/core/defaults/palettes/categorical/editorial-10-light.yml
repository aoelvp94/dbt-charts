# Categorical palette: editorial-10-light
#
# Moderate de-emphasis companion. Each stop preserves the base hue while
# reducing chroma and increasing OKLCH lightness. Aliases inherit by position.

name: editorial-10-light
extends: editorial-10
description: |
  Moderate light companion to editorial-10. Each stop is lighter and quieter
  than its positionally paired base stop, and darker than its ghost partner.

colors:
  - "#7990b6"    # 1  blue
  - "#a3bad7"    # 2  sky
  - "#8ea598"    # 3  green
  - "#9a8595"    # 4  purple
  - "#e0b993"    # 5  gold
  - "#c29180"    # 6  rust
  - "#bdcacb"    # 7  teal
  - "#c7bcaa"    # 8  brown
  - "#a0a9b1"    # 9  gray
  - "#8a9092"    # 10 graphite
