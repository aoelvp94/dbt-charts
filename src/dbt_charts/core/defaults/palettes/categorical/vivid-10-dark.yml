# Categorical palette — vivid-10-dark
#
# Dark companion to vivid-10. Each stop is the darker counterpart of the same
# slot in `vivid-10.yml` — used for direct labels that need higher contrast
# against light backgrounds (e.g. right-pane endpoint labels on multi-series
# lines, segment names on stacked bars).
#
# Pairing is positional: stop N here is the dark companion of stop N in
# vivid-10. Reviewers edit the variant set (`vivid-10`, `vivid-10-dark`,
# `vivid-10-light`, `vivid-10-ghost`) together when the categorical palette
# changes — this file handles direct-label inking.
#
# Construction: each stop drops OKLCH L measurably below its base (label-ink
# gap 0.07-0.17) with hue held and chroma at ~1.05x base. The five pushed
# slots (blue/cyan/green/gold/moss) are re-derived from the vivid base holding
# the category-10 companion's L-gap; brown/purple/orange/gray/charcoal carry
# over unchanged from category-10-dark (brown & orange were hand-deepened
# there to L=0.39 / 0.52 so each can ink a label).

name: vivid-10-dark
extends: vivid-10
description: |
  Dark companion to vivid-10. Ten slots, each darker than the matching
  vivid-10 stop. Designed for direct-label color (chart endpoint labels,
  right-pane segment names) where bright fills need a darker text counterpart
  against light backgrounds. Pairing is positional: slot N here pairs with
  slot N in vivid-10.

colors:
  - "#005998"    # 1 — blue       (companion to #0073c2)
  - "#00a1c0"    # 2 — cyan       (companion to #00c8ee)
  - "#008055"    # 3 — green      (companion to #00ad75)
  - "#a07400"    # 4 — gold       (companion to #e1a500)
  - "#b03e00"    # 5 — orange     (companion to #da5a23)
  - "#82568d"    # 6 — purple     (companion to #a46fb2)
  - "#4a6c00"    # 7 — moss       (companion to #6a9228)
  - "#5f3a12"    # 8 — brown      (companion to #7a5531)
  - "#6c7685"    # 9 — gray       (companion to #949daa)
  - "#404852"    # 10 — charcoal  (companion to #505b6b)
