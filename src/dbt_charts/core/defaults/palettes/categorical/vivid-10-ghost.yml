# Categorical palette — vivid-10-ghost
#
# Extreme de-emphasis companion to vivid-10. Each stop is the very light,
# desaturated counterpart of the same slot in `vivid-10.yml` — used for fading
# out-of-focus members of a series so the highlighted member (rendered in its
# base color) reads forward.
#
# Pairing is positional: stop N here is the ghost companion of stop N in
# vivid-10. Reviewers edit the variant set (`vivid-10`, `vivid-10-dark`,
# `vivid-10-light`, `vivid-10-ghost`) together when the categorical palette
# changes.
#
# Derivation: uniform OKLCH lift to L=0.86 with chroma ~0.32x base (per-slot
# hue preserved). Slot 10 (charcoal) is held at L=0.80 — lifted toward the
# ghost band but kept a notch below it so it stays visibly distinct from
# slot 9 (gray, L=0.86). The five pushed slots (blue/cyan/green/gold/moss)
# are re-derived from the vivid base; the rest carry over from
# category-10-ghost.

name: vivid-10-ghost
extends: vivid-10
description: |
  Extreme de-emphasis companion to vivid-10. Ten slots, each much lighter and
  more desaturated than the matching vivid-10 stop. Designed for ghosting
  out-of-focus members of a series while preserving positional hue identity.
  Pairing is positional: slot N here pairs with slot N in vivid-10.

colors:
  - "#b9d4f0"    # 1 — blue       (companion to #0073c2)
  - "#b2d9e5"    # 2 — cyan       (companion to #00c8ee)
  - "#b6dbc7"    # 3 — green      (companion to #00ad75)
  - "#dccec2"    # 4 — brown      (companion to #7a5531)
  - "#e2cfad"    # 5 — gold       (companion to #e1a500)
  - "#dccae1"    # 6 — purple     (companion to #a46fb2)
  - "#f2c6b6"    # 7 — orange     (companion to #da5a23)
  - "#c8d7b8"    # 8 — moss       (companion to #6a9228)
  - "#ced1d6"    # 9 — gray       (companion to #949daa)
  - "#babec4"    # 10 — charcoal  (companion to #505b6b)
