# Sequential palette — purple
#
# Hand-authored 11-stop spine. Downsamples drive seq palette resolution.

name: dbt-seq-purple
family: sequential
description: Single-hue purple. Harmonizes with vivid-10 purple and editorial-10 purple.
design_notes: |
  Monotonic L* from 0.95 → 0.25. Hue anchored on cat-10 purple (H≈319.1°); c_max=0.11 (down from 0.13). Session 8 retune.

colors:
