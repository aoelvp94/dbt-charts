  - "#e5ceeb"
  - "#d4b3dd"
  - "#c29acd"
  - "#af82bb"
  - "#9b6ba8"    # step 6 — mid
  - "#875694"
  - "#72427e"
  - "#5c3068"
  - "#471f51"
  - "#32113a"    # step 11 — darkest
