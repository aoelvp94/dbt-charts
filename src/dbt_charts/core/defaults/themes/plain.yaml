# Unified theme: plain
# The deliberately-boring c.2022-BI sans theme — the muted-SANS counterpart to
# editorial's muted-serif. editorial-10 (muted) data palette + dbt-grays chrome.
# Intentionally UN-crafted vs vivid: legends on for bars/categorical (multi-series
# lines & areas direct-label via endpoint labels inherited from stark), visible
# medium gridlines, normal-weight titles, no values-pop, no rounded bars.
# The safe, unopinionated default for reporting apps.
extends: stark
style:
  background: dbt-grays.white
  page:
    background: dbt-grays.white
  accent: dbt-creams.accent   # denim link (matches editorial); stark's accent is too hot for this theme
  # Plain is multi-tier (axis labels/titles already sit on the gray ladder),
  # so muted rebinds to the ladder's secondary rung — stark's single-tier
  # ink would erase the support-row/subtitle softening this theme wants.
  muted: dbt-grays.muted
  # Muted editorial-10 data palette (the quiet colors), on a sans theme.
  palettes:
    sequence: dbt-seq-blue
    category: editorial-10
    category_dark: editorial-10-dark
    category_light: editorial-10-light
    category_ghost: editorial-10-ghost
    category_ink: editorial-10-ink
  font:
    color: dbt-grays.ink
  title:
    font:
      color: dbt-grays.heading
      weight: 500          # normal-ish; no bold display voice
  charts:
    color:
      categorical:
        single_series_palette: ['editorial-10.1']   # editorial denim single series
    # Generic BI chrome: medium-gray, visible — nothing recedes dramatically.
    axis:
      line:
        color: dbt-grays.grid-emphasis
      grid:
        color: dbt-grays.grid-emphasis   # visible, medium (the BI-default look)
      ticks:
        color: dbt-grays.grid-emphasis
      labels:
        font:
          color: dbt-grays.muted
      title:
        font:
          color: dbt-grays.subtitle
    axis_y:
      grid:
        zero:
          color: dbt-grays.subtitle
    # Themed sequential default for heatmap/geoshape gradient color — matches
    # editorial's steel-blue accent (plain shares editorial's muted data
    # palette on a sans theme).
    geoshape:
      color:
        gradient:
          palette: sequence
    heatmap:
      color:
        gradient:
          palette: sequence
    # Soft light tooltip, mirroring editorial's look -- stark (the structural
    # root plain extends directly) now sets a sharp/thick/no-shadow/triangle
    # tooltip for its own utilitarian voice; plain wants the same soft BI-report
    # look as editorial, so it needs its own full block rather than inheriting.
    tooltip:
      background: dbt-grays.white
      label:
        font:
          color: dbt-grays.muted
      value:
        font:
          color: dbt-grays.ink
      border:
        color: dbt-grays.border
        # No border on shadowed themes: the shadow separates the card, so the
        # outline is redundant (kept only on stark — see editorial.yaml).
        width: 0.0
        radius: 4.0
      shadow:
        visible: true
      swatch:
        radius: 3.0
      active_marker: fill
    # BI convention: keep the legend for bars/categorical. Multi-series lines
    # & areas direct-label instead (endpoint labels inherited from stark).
    legend:
      visible: true
      label:
        font:
          color: dbt-grays.muted
      title:
        font:
          color: dbt-grays.heading
    table:
      border:
        color: dbt-grays.border
      header:
        font:
          color: dbt-grays.heading
      row:
        stripe:
          color: dbt-grays.surface-subtle   # subtle zebra (one scaffold stop off white)
    data_table:
      font:
        color: dbt-grays.ink
      label:
        font:
          color: dbt-grays.muted
      divider:
        color: dbt-grays.border
  variables:
    font:
      color: dbt-grays.muted
    border:
      color: dbt-grays.border
    input:
      border:
        color: dbt-grays.border
